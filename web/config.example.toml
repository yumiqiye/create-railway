# 清江铁路12306 端口与密钥配置示例
# 复制为 config.toml 后修改；config.toml 已被 .gitignore 排除

[ticket]
port = 3000
host = "127.0.0.1"

[admin]
port = 8001
host = "127.0.0.1"

[railway]
# 必须与模组 config/railway_plus-common.toml 的 web.adminToken 保持一致
adminToken = "change-me"
currency = "emerald"

[shared]
# 动态电子客票二维码签名密钥，ticket 与 check 必须一致
qr_secret = "change-me-to-a-long-random-string"
qr_ttl = 90

[hCaptcha]
enabled = false
siteKey = ""
secret = ""
