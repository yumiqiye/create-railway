plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// 每次打包构建自动调整版本号，避免反复复用同一个版本号：
// - 稳定版 1.0.6 -> 1.0.7；
// - Beta 版 1.0.6-BETA.1 -> .2 -> .3 -> .4 -> .5；
// - BETA.5 再打包时回到稳定版 1.0.7。
// 触发任务：build / assemble / jar（出 Jar 的打包任务）；compileJava、runClient、runServer 不递增。
// 需要临时关闭递增时加 -PnoVersionBump。
def versionBumpTasks = ['build', 'assemble', 'jar']
def wantsVersionBump = gradle.startParameter.taskNames.any { tn ->
    versionBumpTasks.any { t -> tn == t || tn.endsWith(':' + t) }
} && !project.hasProperty('noVersionBump')

def versionMatcher = mod_version =~ /^(\d+)\.(\d+)\.(\d+)(?:-BETA\.(\d+))?$/
String nextVersion = mod_version
if (wantsVersionBump && versionMatcher.matches()) {
    def major = versionMatcher.group(1)
    def minor = versionMatcher.group(2)
    def patch = versionMatcher.group(3).toInteger()
    def betaText = versionMatcher.group(4)
    if (betaText != null) {
        def beta = betaText.toInteger()
        nextVersion = beta >= 5
                ? "${major}.${minor}.${patch + 1}"
                : "${major}.${minor}.${patch}-BETA.${beta + 1}"
    } else {
        nextVersion = "${major}.${minor}.${patch + 1}"
    }
    logger.lifecycle("Auto version bump: ${mod_version} -> ${nextVersion}")
} else if (wantsVersionBump) {
    logger.lifecycle("Version bump skipped: unrecognized version format '${mod_version}'")
}
def effectiveVersion = nextVersion

version = effectiveVersion
group = mod_group_id
base.archivesName = "CreateRailwayPlus-${minecraft_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// ❌ 不要添加 repositories {} 块

// NFRT 的 Minecraft 版本清单走 BMCLAPI，避免直连 piston-meta
def nfrtExt = extensions.findByName('neoFormRuntime')
if (nfrtExt != null) {
    nfrtExt.launcherManifestUrl.set('https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json')
    nfrtExt.enableCache.set(true)
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// 把 Node 票务后端、游戏内静态页和后台构建产物打成 Jar 内的 embedded.zip。
// node_modules 不进 Jar：首次启动在配置目录自动安装精简后的生产依赖，关闭游戏时随模组停止。
tasks.register('bundleEmbeddedWeb', Zip) {
    archiveFileName = 'embedded.zip'
    destinationDirectory = layout.buildDirectory.dir('embedded-web')
    includeEmptyDirs = false
    from('../web/shared') { into 'shared' }
    from('../web/ticket') {
        into 'ticket'
        include 'package.json'
        include 'db.js'
        include 'server.js'
        include 'public/tvm.html'
        include 'public/guide.html'
        include 'public/guide.js'
        include 'public/guide.css'
        include 'public/screen.html'
        include 'public/screen.js'
        include 'public/screen.css'
        include 'public/favicon.svg'
    }
    from('../web/admin/dist') { into 'admin/dist' }
    from('../web/embedded/admin-server.js') { into '.' }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'bundleEmbeddedWeb'
    var properties = [mod_version: effectiveVersion, mod_name: mod_name,
                      minecraft_version: minecraft_version, neo_version: neo_version]
    inputs.properties properties
    from(bundleEmbeddedWeb.getArchiveFile()) { into 'embedded' }
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
            'Specification-Title': mod_name,
            'Specification-Vendor': 'Qingjiang Railway',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Qingjiang Railway'
    ])
    // Jar 成功生成后才把新版本号写回 gradle.properties，构建失败不会留下空跳号。
    doLast {
        def propsFile = file('gradle.properties')
        def propsText = propsFile.getText('UTF-8')
        def updated = propsText.replaceAll(/(?m)^mod_version=.*$/, "mod_version=${nextVersion}")
        if (updated != propsText) {
            propsFile.setText(updated, 'UTF-8')
            logger.lifecycle("Persisted version ${nextVersion} to gradle.properties")
        }
    }
}