org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=10

minecraft_version=1.21.1
neo_version=21.1.233
mod_id=hexie_railway
mod_name=Hexie Railway Addon
mod_group_id=qingjiang.railway
mod_version=1.0.0
systemProp.java.net.preferIPv4Stack=true

# 关闭 SSL 证书/主机名校验
systemProp.maven.wagon.http.ssl.insecure=true
systemProp.maven.wagon.http.ssl.allowall=true
systemProp.maven.wagon.http.ssl.ignore.validity.dates=true
systemProp.com.sun.net.ssl.checkRevocation=false

# 【新增】强制 Gradle 走 Clash 代理 (端口 7897)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897